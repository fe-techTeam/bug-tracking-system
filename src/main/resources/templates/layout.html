<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Bug Tracking'">Bug Tracking</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400..600&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Applied before first paint, so a dark theme never flashes white. -->
    <script>
        (function () {
            var root = document.documentElement;
            root.classList.add("js");
            try {
                var t = localStorage.getItem("bugtracking.theme");
                if (t === "light" || t === "dark") root.setAttribute("data-theme", t);
            } catch (e) { /* private mode: fall back to the system theme */ }
        })();
    </script>
</head>
<body>

<div class="app">

    <!-- ================= the navbar: the only chrome there is =================
         Which section you are in is worked out once: the bar marks it, and the
         user menu marks the same items again, because a narrow bar folds the
         links away and the menu is then the only place they exist. -->
    <header class="navbar"
            th:with="onBoard=${currentPath != null and #strings.startsWith(currentPath, '/bugs')},
                     onDocs=${currentPath != null and (#strings.startsWith(currentPath, '/documents')
                                  or (#strings.startsWith(currentPath, '/projects/')
                                      and #strings.contains(currentPath, '/docs')))},
                     onSettings=${currentPath != null and (#strings.startsWith(currentPath, '/settings')
                                  or #strings.startsWith(currentPath, '/team')
                                  or (#strings.startsWith(currentPath, '/projects')
                                      and not #strings.contains(currentPath, '/docs')))}">
        <!-- The label is hidden on a narrow bar, and the mark is decorative, so
             the name has to be on the link itself or this is an unnamed tile. -->
        <a class="brand" th:href="@{/bugs}" id="nav-brand" aria-label="Bug Tracking — board">
            <span class="brand-mark" aria-hidden="true">B</span>
            <span class="lbl">Bug Tracking</span>
        </a>

        <nav class="nav-links">
            <a class="nav-link" th:href="@{/bugs}" id="board-link"
               title="Board" aria-label="Board"
               th:classappend="${onBoard} ? 'is-active' : ''"
               th:attr="aria-current=${onBoard ? 'page' : null}">
                <svg class="i" aria-hidden="true"><use href="#i-board"/></svg>
                <span>Board</span>
            </a>
            <!-- Carries the project you were last on, so Documents opens the
                 one you are working in rather than the first one alphabetically. -->
            <a class="nav-link" id="docs-link"
               th:href="${currentProject != null} ? @{/documents(project=${currentProject})} : @{/documents}"
               title="Documents" aria-label="Documents"
               th:classappend="${onDocs} ? 'is-active' : ''"
               th:attr="aria-current=${onDocs ? 'page' : null}">
                <svg class="i" aria-hidden="true"><use href="#i-folder"/></svg>
                <span>Documents</span>
            </a>
            <a class="nav-link" th:href="@{/settings}" id="settings-link"
               title="Settings" aria-label="Settings"
               th:classappend="${onSettings} ? 'is-active' : ''"
               th:attr="aria-current=${onSettings ? 'page' : null}">
                <svg class="i" aria-hidden="true"><use href="#i-settings"/></svg>
                <span>Settings</span>
            </a>
        </nav>

        <div class="nav-right">
            <!-- One label for both: a static aria-label would override the count
                 badge inside the link, so the number would be on screen and
                 nowhere in the accessible name. -->
            <a class="bell" th:href="@{/bugs/trash}" id="trash-link"
               th:with="trashLabel=${trashCount > 0}
                        ? ${trashCount} + ' deleted bug' + (${trashCount == 1} ? '' : 's') + ' — restorable'
                        : 'Trash'"
               th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/bugs/trash')} ? 'is-active' : ''"
               th:title="${trashLabel}"
               th:attr="aria-label=${trashLabel}">
                <svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>
                <span class="bell-count num" th:if="${trashCount > 0}" id="trash-count"
                      th:text="${trashCount > 99} ? '99+' : ${trashCount}">2</span>
            </a>

            <div th:replace="~{fragments :: bell}"></div>

            <button type="button" class="icon-btn" id="theme-toggle"
                    title="Switch theme" aria-label="Switch theme">
                <svg class="i" aria-hidden="true"><use href="#i-moon"/></svg>
            </button>

            <!-- Who is signed in, where you are, and the two views that are
                 only about you — everything the bar drops when it narrows. -->
            <details class="pop-wrap" id="user-menu">
                <!-- Both children of the button are decorative once the name is
                     hidden, so without this the only route to Sign out has no
                     accessible name at all. -->
                <summary th:attr="aria-label='Signed in as ' + ${#authentication.name} + ' — account menu'">
                    <span class="user-btn" id="current-user">
                        <span class="avatar avatar-sm" th:attr="data-avatar=${#authentication.name}"
                              aria-hidden="true"></span>
                        <span class="user-name" th:text="${#authentication.name}">Nishana R</span>
                        <svg class="i chev" aria-hidden="true"><use href="#i-chevron"/></svg>
                    </span>
                </summary>

                <div class="pop">
                    <div class="user-card">
                        <span class="avatar avatar-lg" th:attr="data-avatar=${#authentication.name}"
                              aria-hidden="true"></span>
                        <span class="who">
                            <b th:text="${#authentication.name}">Nishana R</b>
                            <span>Recorded on your comments and changes</span>
                        </span>
                    </div>

                    <!-- The board, because the section links are the first thing
                         a narrow bar drops and this menu is where they land. -->
                    <a class="pop-item" id="menu-board" th:href="@{/bugs}"
                       th:classappend="${onBoard} ? 'is-active' : ''"
                       th:attr="aria-current=${onBoard ? 'page' : null}">
                        <svg class="i" aria-hidden="true"><use href="#i-board"/></svg>
                        <span>Board</span>
                    </a>
                    <a class="pop-item" id="menu-docs"
                       th:href="${currentProject != null} ? @{/documents(project=${currentProject})} : @{/documents}"
                       th:classappend="${onDocs} ? 'is-active' : ''"
                       th:attr="aria-current=${onDocs ? 'page' : null}">
                        <svg class="i" aria-hidden="true"><use href="#i-folder"/></svg>
                        <span>Documents</span>
                    </a>
                    <a class="pop-item" id="my-assigned"
                       th:href="@{/bugs(assignee=${#authentication.name})}">
                        <svg class="i" aria-hidden="true"><use href="#i-inbox"/></svg>
                        <span>Assigned to me</span>
                    </a>
                    <a class="pop-item" id="my-reported"
                       th:href="@{/bugs(reporter=${#authentication.name})}">
                        <svg class="i" aria-hidden="true"><use href="#i-pen"/></svg>
                        <span>Raised by me</span>
                    </a>
                    <a class="pop-item" id="menu-settings" th:href="@{/settings}"
                       th:classappend="${onSettings} ? 'is-active' : ''"
                       th:attr="aria-current=${onSettings ? 'page' : null}">
                        <svg class="i" aria-hidden="true"><use href="#i-settings"/></svg>
                        <span>Projects &amp; team</span>
                    </a>

                    <div class="pop-foot">
                        <form method="post" th:action="@{/logout}" class="inline-form">
                            <button type="submit" class="pop-item" id="logout-button">
                                <svg class="i" aria-hidden="true"><use href="#i-logout"/></svg>
                                <span>Sign out</span>
                            </button>
                        </form>
                    </div>
                </div>
            </details>
        </div>
    </header>

    <!-- ================= everything else ================= -->
    <div class="app-body">
        <div th:replace="${content}">Page content goes here</div>
    </div>
</div>

<!-- Where an attachment opens. Empty until a thumbnail is clicked; the
     thumbnail is a real link, so this only saves leaving the page. -->
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Attachment">
    <div class="lightbox-bar">
        <span class="lightbox-name" id="lightbox-name">file</span>
        <a class="btn btn-sm btn-ghost" id="lightbox-open" href="#" target="_blank" rel="noopener">Open</a>
        <button type="button" class="icon-btn" id="lightbox-close" title="Close" aria-label="Close">
            <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
    </div>
    <div class="lightbox-stage" id="lightbox-stage"></div>
</div>

<div class="toast" th:if="${message}" id="flash-message" role="status">
    <span class="toast-dot" aria-hidden="true">✓</span>
    <span th:text="${message}">Saved.</span>
    <!-- Undo where it actually helps: right after the thing you might regret. -->
    <form method="post" th:if="${undoBugId}" class="inline-form"
          th:action="@{/bugs/{id}/restore(id=${undoBugId})}">
        <input type="hidden" name="actor" class="actor-field">
        <button type="submit" class="toast-undo" id="undo-delete">Undo</button>
    </form>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
