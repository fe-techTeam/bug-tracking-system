<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(${project.name} + ' documents', ~{::section})}">
<body>
<!--
  A project's documents, as a page.

  The filing is done in the drawer now — the navbar's Documents link opens it
  over whatever you are on, which is where you actually want it: you fetch one
  document while reading a bug, not by going somewhere to browse. This page is
  the same panel, drawn full width, and it exists for two reasons and no more:
  it is where "Full page" in the drawer goes, and it is the whole of documents
  for a browser with JavaScript switched off.

  One fragment, so there is one design and one set of forms to keep right. What
  used to be here — a folder rail, a card grid, a per-card popover menu and a
  search box — was a second browser to keep in step with this one.
-->
<section class="docs-page">

    <header class="topbar">
        <a class="back-link" th:href="@{/bugs(project=${project.name})}"
           title="Go back" aria-label="Go back">
            <svg class="i" aria-hidden="true"><use href="#i-arrow-left"/></svg>
            </a>

        <span class="avatar" th:attr="data-avatar=${project.name}" aria-hidden="true"></span>
        <h1 class="topbar-title" th:text="${project.name}">Godrej</h1>
        <span class="topbar-sub">Documents — the specs, files and links the whole project works from</span>

        <div class="topbar-actions">
            <div th:replace="~{fragments :: bell}"></div>
        </div>
    </header>

    <div class="content">
        <div class="stack stack-narrow">
            <div class="panel">
                <div class="panel-pad">
                    <div th:replace="~{fragments :: docsPanel}"></div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
