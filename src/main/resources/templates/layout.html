<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Bug Tracking'">Bug Tracking</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400..600&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Applied before first paint, so a dark theme never flashes white. -->
    <script>
        (function () {
            var root = document.documentElement;
            root.classList.add("js");
            try {
                var t = localStorage.getItem("bugtracking.theme");
                if (t === "light" || t === "dark") root.setAttribute("data-theme", t);
            } catch (e) { /* private mode: fall back to the system theme */ }
        })();
    </script>
</head>

<div class="app">

    <!-- ================= the navbar: the only chrome there is =================
         Which section you are in is worked out once: the bar marks it, and the
         user menu marks the same items again, because a narrow bar folds the
         links away and the menu is then the only place they exist. -->
    <header class="navbar"
            th:with="onBoard=${currentPath != null and #strings.startsWith(currentPath, '/bugs')},
                     onDocs=${currentPath != null and (#strings.startsWith(currentPath, '/documents')
                                  or (#strings.startsWith(currentPath, '/projects/')
                                      and #strings.contains(currentPath, '/docs')))},
                     onTeam=${currentPath != null and (#strings.startsWith(currentPath, '/settings')
                                  or #strings.startsWith(currentPath, '/team')
                                  or (#strings.startsWith(currentPath, '/projects')
                                      and not #strings.contains(currentPath, '/docs')))}">
        <!-- The project, in the spot the app's own name used to hold. One
             app does not need to say what it is on every screen; which project
             you are looking at is the thing you actually check, and it was a
             second bar down. Everything it needs is a global model attribute,
             so it works from every page rather than only the board. -->
        <div class="switcher" id="project-switcher"
             th:with="shown=${selectedProject != null ? selectedProject : currentProject}">
            <button type="button" class="switcher-btn switcher-title" id="switcher-btn"
                    aria-expanded="false" aria-haspopup="listbox" aria-controls="switcher-menu"
                    title="Switch project">
                <span class="avatar" th:if="${shown}"
                      th:attr="data-avatar=${shown}" aria-hidden="true"></span>
                <span class="avatar" th:unless="${shown}" aria-hidden="true">–</span>
                <span class="switcher-name" id="board-title"
                      th:text="${shown} ?: 'All projects'">Godrej</span>
                <svg class="i switcher-chev" aria-hidden="true"><use href="#i-selector"/></svg>
            </button>

            <div class="switcher-menu" id="switcher-menu" role="listbox" hidden>
                <div class="switcher-search" th:if="${projectCounts != null and projectCounts.size() > 6}">
                    <!-- A project name is not prose: no capitalising, no autocorrect,
                         and the phone's return key says Search, not Go. -->
                    <input type="text" id="switcher-filter" placeholder="Find a project…"
                           autocomplete="off" aria-label="Find a project"
                           inputmode="search" enterkeyhint="search"
                           autocapitalize="none" autocorrect="off" spellcheck="false">
                </div>

                <div class="switcher-list" id="switcher-list">
                    <a class="switcher-item" th:each="entry : ${projectCounts}"
                       th:href="@{/bugs(project=${entry.key})}"
                       th:classappend="${entry.key == shown} ? 'is-active' : ''"
                       th:data-name="${entry.key}" role="option"
                       th:attr="aria-selected=${entry.key == shown}">
                        <span class="avatar avatar-sm" th:attr="data-avatar=${entry.key}" aria-hidden="true"></span>
                        <span class="switcher-item-name" th:text="${entry.key}">Godrej</span>
                        <span class="switcher-item-count num" th:if="${entry.value > 0}"
                              th:text="${entry.value}">4</span>
                    </a>
                </div>

                <p class="switcher-empty" th:if="${projectCounts == null or projectCounts.isEmpty()}">
                    No projects yet.
                </p>

                <div class="switcher-foot">
                    <a th:href="@{/settings}">Manage projects</a>
                    <a th:href="@{/settings}" aria-label="Add a project">+ New</a>
                </div>
            </div>
        </div>

        <nav class="nav-links">
            <!-- "Home", not "Board": the board is one of three ways to read the
                 same bugs, and naming the way in after one of them made the
                 other two feel like somewhere you had wandered off to. Plain
                 /bugs on purpose — the view is remembered in the session, so
                 this comes back to the list if the list is where you were, and
                 keeps doing so on the next visit. Its id is unchanged; the
                 Selenium notes name it. -->
            <a class="nav-link" th:href="@{/bugs}" id="board-link"
               title="Home" aria-label="Home"
               th:classappend="${onBoard} ? 'is-active' : ''"
               th:attr="aria-current=${onBoard ? 'page' : null}">
                <svg class="i" aria-hidden="true"><use href="#i-home"/></svg>
                <span>Home</span>
            </a>
            <!-- Carries the project you were last on, so Documents opens the
                 one you are working in rather than the first one alphabetically. -->
            <a class="nav-link" id="docs-link"
               th:href="${currentProject != null} ? @{/documents(project=${currentProject})} : @{/documents}"
               title="Documents" aria-label="Documents"
               th:classappend="${onDocs} ? 'is-active' : ''"
               th:attr="aria-current=${onDocs ? 'page' : null}">
                <svg class="i" aria-hidden="true"><use href="#i-folder"/></svg>
                <span>Documents</span>
            </a>
            <!-- Opens the team drawer: who is on the project you are looking
                 at, and a tick to put somebody else on it. That is daily work,
                 so it stays for everybody.

                 Its no-script fallback is Settings, which only an admin may
                 open — so for everybody else the link is marked .nav-link-js
                 and appears only once the inline script in <head> has confirmed
                 scripting works. A link that 403s is worse than no link. -->
            <a class="nav-link" th:href="@{/settings(tab='team')}" id="settings-link"
               title="Team" aria-label="Team"
               th:classappend="${(onTeam ? 'is-active ' : '') + (isAdmin ? '' : 'nav-link-js')}"
               th:attr="aria-current=${onTeam ? 'page' : null}">
                <svg class="i" aria-hidden="true"><use href="#i-users"/></svg>
                <span>Team</span>
            </a>
        </nav>

        <div class="nav-right">
            <!-- No search box here any more. The board's own filter bar is the
                 search — it owns the URL and survives JavaScript being off —
                 and Cmd/Ctrl+K still opens the palette over any page, so the
                 only thing that went is a second box beside the trash. -->

            <!-- One label for both: a static aria-label would override the count
                 badge inside the link, so the number would be on screen and
                 nowhere in the accessible name. -->
            <a class="bell" th:href="@{/bugs/trash}" id="trash-link"
               th:with="trashLabel=${trashCount > 0}
                        ? ${trashCount} + ' deleted bug' + (${trashCount == 1} ? '' : 's') + ' — restorable'
                        : 'Trash'"
               th:classappend="${(trashCount > 0 ? 'is-full ' : '')
                        + (currentPath != null and #strings.startsWith(currentPath, '/bugs/trash') ? 'is-active' : '')}"
               th:title="${trashLabel}"
               th:attr="aria-label=${trashLabel}">
                <svg class="i" aria-hidden="true">
                    <use th:attr="href=${trashCount > 0 ? '#i-trash-full' : '#i-trash'}"/>
                </svg>
                <!-- The number is still here and still has its id; it is simply
                     not a red badge. Nothing in the bin needs acting on — it is
                     somewhere to look, not something to clear. -->
                <span class="sr-only" th:if="${trashCount > 0}" id="trash-count"
                      th:text="${trashCount}">2</span>
            </a>

            <!-- Where a card dropped on the bin goes. A real form rather than
                 a fetch, because the delete route answers with the flash that
                 carries Undo — and that undo is what makes dropping a bug on a
                 bin a safe thing to be able to do by accident.

                 The action is composed in app.js from data-base rather than
                 written here with a placeholder in it: a name of the shape
                 __id__ is Thymeleaf's own preprocessing syntax, and it ate the
                 underscores before the browser ever saw them. -->
            <!-- th:action, even though app.js overwrites it: the CSRF field is
                 injected into forms that have one, and without it the post is
                 rejected before it reaches the route. -->
            <form method="post" id="trash-drop-form" hidden
                  th:action="@{/bugs}" th:attr="data-base=@{/bugs}">
                <input type="hidden" name="actor" class="actor-field">
            </form>

            <div th:replace="~{fragments :: bell}"></div>

            <button type="button" class="icon-btn" id="theme-toggle"
                    title="Switch theme" aria-label="Switch theme">
                <svg class="i" aria-hidden="true"><use href="#i-moon"/></svg>
            </button>

            <!-- Who is signed in, and the two things that are about the
                 account rather than the work. The section links used to be
                 repeated here for a narrow bar; they are not, because the bar
                 keeps them as icons at every width (see the 900px rule on
                 .nav-link > span), so this was a second copy of a menu that
                 never goes away. -->
            <details class="pop-wrap" id="user-menu">
                <!-- Both children of the button are decorative once the name is
                     hidden, so without this the only route to Sign out has no
                     accessible name at all. -->
                <summary th:attr="aria-label='Signed in as ' + ${#authentication.name} + ' — account menu'">
                    <span class="user-btn" id="current-user">
                        <span class="avatar avatar-sm" th:attr="data-avatar=${#authentication.name}"
                              aria-hidden="true"></span>
                        <span class="user-name" th:text="${#authentication.name}">Nishana R</span>
                        <svg class="i chev" aria-hidden="true"><use href="#i-chevron"/></svg>
                    </span>
                </summary>

                <div class="pop">
                    <div class="user-card">
                        <span class="avatar avatar-lg" th:attr="data-avatar=${#authentication.name}"
                              aria-hidden="true"></span>
                        <span class="who">
                            <b th:text="${#authentication.name}">Nishana R</b>
                            <span>Recorded on your comments and changes</span>
                        </span>
                        <!-- Only for the people it says something about. A badge
                             reading "Member" on everybody is a badge nobody
                             reads; one reading "Admin" on two people out of
                             twenty is the whole message. -->
                        <span class="badge role-badge" sec:authorize="hasRole('ADMIN')"
                              style="--c: var(--col-VIOLET)">Admin</span>
                    </div>

                    <!-- Your own password, which is not administration and so
                         is not behind Settings. Everybody has this; only an
                         admin has the line under it. -->
                    <a class="pop-item" id="menu-account" th:href="@{/account}">
                        <svg class="i" aria-hidden="true"><use href="#i-lock"/></svg>
                        <span>Your account</span>
                    </a>

                    <a class="pop-item" id="menu-settings" th:href="@{/settings}"
                       sec:authorize="hasRole('ADMIN')"
                       th:classappend="${onTeam} ? 'is-active' : ''"
                       th:attr="aria-current=${onTeam ? 'page' : null}">
                        <svg class="i" aria-hidden="true"><use href="#i-settings"/></svg>
                        <span>Settings</span>
                    </a>

                    <div class="pop-foot">
                        <form method="post" th:action="@{/logout}" class="inline-form">
                            <button type="submit" class="pop-item" id="logout-button">
                                <svg class="i" aria-hidden="true"><use href="#i-logout"/></svg>
                                <span>Sign out</span>
                            </button>
                        </form>
                    </div>
                </div>
            </details>
        </div>
    </header>

    <!-- ================= everything else ================= -->
    <div class="app-body">
        <div th:replace="${content}">Page content goes here</div>
    </div>
</div>

<!-- Where an attachment opens. Empty until a thumbnail is clicked; the
     thumbnail is a real link, so this only saves leaving the page. -->
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Attachment">
    <div class="lightbox-bar">
        <!-- Where you are in the set, so stepping through it is a thing with an
             end rather than an arrow you keep pressing. Hidden when a bug has
             one thing on it and there is nowhere to step to. -->
        <span class="lightbox-count num" id="lightbox-count" hidden>1 / 4</span>
        <span class="lightbox-name" id="lightbox-name">file</span>

        <!-- Only for a picture: there is nothing to zoom in a video that its own
             controls do not already do better. -->
        <span class="lightbox-zoom" id="lightbox-zoom" hidden>
            <button type="button" class="icon-btn icon-btn-sm" id="lightbox-zoom-out"
                    title="Zoom out" aria-label="Zoom out">
                <svg class="i" aria-hidden="true"><use href="#i-zoom-out"/></svg>
            </button>
            <button type="button" class="lightbox-zoom-level num" id="lightbox-zoom-level"
                    title="Fit to the window" aria-label="Zoom level — click to fit to the window">100%</button>
            <button type="button" class="icon-btn icon-btn-sm" id="lightbox-zoom-in"
                    title="Zoom in" aria-label="Zoom in">
                <svg class="i" aria-hidden="true"><use href="#i-zoom-in"/></svg>
            </button>
        </span>

        <a class="btn btn-sm btn-ghost" id="lightbox-open" href="#" target="_blank" rel="noopener">Open</a>
        <button type="button" class="icon-btn" id="lightbox-close" title="Close" aria-label="Close">
            <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
    </div>

    <!-- The arrows sit over the stage rather than beside it: a picture that
         gave up 90px on each side to two buttons was smaller for it on every
         screen, including the ones with nothing to step to. -->
    <div class="lightbox-body">
        <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" hidden
                title="Previous attachment" aria-label="Previous attachment">
            <svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg>
        </button>
        <div class="lightbox-stage" id="lightbox-stage"></div>
        <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" hidden
                title="Next attachment" aria-label="Next attachment">
            <svg class="i" aria-hidden="true"><use href="#i-chevron-right"/></svg>
        </button>
    </div>

    <!-- Everything else on the bug, so stepping through is a thing you can see
         the shape of. app.js fills it; empty markup here means one attachment
         costs nothing. -->
    <div class="lightbox-strip" id="lightbox-strip" hidden role="group"
         aria-label="The other attachments in this set"></div>
</div>

<!-- ========================= quick search =========================
     Cmd+K on a Mac, Ctrl+K everywhere else. Nothing depends on it: every row
     it renders is a bug page that /bugs?keyword= already reaches, and the
     trigger beside it is a link to the board with JavaScript off. It is empty
     until it is opened — app.js fills the results from /bugs/search. -->
<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Search bugs">
    <div class="palette-box">
        <div class="palette-field">
            <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
            <!-- combobox, so the arrow keys moving a highlight inside the list
                 below are announced instead of being a silent visual change. -->
            <input type="search" id="palette-input" autocomplete="off" spellcheck="false"
                   placeholder="Search bugs by title, id, project or person"
                   aria-label="Search bugs"
                   role="combobox" aria-expanded="true" aria-autocomplete="list"
                   aria-controls="palette-results">
            <button type="button" class="icon-btn" id="palette-close"
                    title="Close" aria-label="Close search">
                <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
            </button>
        </div>

        <div class="palette-results" id="palette-results" role="listbox" aria-label="Search results"></div>

        <!-- Announced without stealing focus: the row count changes as you type
             and the highlight is the only other thing that moves. -->
        <p class="sr-only" id="palette-status" role="status" aria-live="polite"></p>

        <div class="palette-foot">
            <span><kbd>&#8593;</kbd><kbd>&#8595;</kbd> move</span>
            <span><kbd>&#8629;</kbd> open</span>
            <span><kbd>Esc</kbd> close</span>
        </div>
    </div>
</div>

<!-- ===================== the team drawer =====================
     Who is on the project you are looking at, opened from the navbar rather
     than walked to: the roster with the project's people ticked and sorted to
     the top, and a + for somebody who is not on the team at all yet. The list
     is fetched from /team/panel — it carries a CSRF token and a form, so it is
     rendered by Thymeleaf like every other form in the app rather than built
     here in script.

     Outside .app on purpose: .navbar and .topbar both carry a backdrop-filter,
     and that makes them the containing block for a fixed-position descendant —
     a drawer opened from inside one would be pinned to the bar. -->
<div class="drawer" id="team-drawer" hidden>
    <div class="drawer-scrim" data-drawer-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="team-drawer-title">
        <header class="drawer-head">
            <svg class="i" aria-hidden="true"><use href="#i-users"/></svg>
            <h2 id="team-drawer-title">Team</h2>

            <!-- Adding somebody lives in the panel now, under the people you
                 could tick — which is the moment you find out the one you want
                 is not among them. A lone + up here said nothing about what it
                 would add, or to what. -->
            <!-- No "Full page". Everything the team needs is here, and a
                 button that leaves for somewhere else is an admission that it
                 is not. Passwords, hiding and removing are still on
                 Settings > Team, which is a page in its own right. -->
            <button type="button" class="icon-btn" data-drawer-close
                    title="Close" aria-label="Close the team">
                <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
            </button>
        </header>
        <div class="drawer-mount" id="team-drawer-body" aria-busy="true"></div>
    </aside>
</div>

<!-- ===================== the documents drawer =====================
     Documents is a filing cabinet you open to fetch one thing, so it opens
     beside the page rather than instead of it. The navbar link is a real link
     to the full page and stays one — app.js intercepts the click and loads
     /documents/panel in here instead. Every row inside is still a link: a
     folder reloads the panel, and anything you actually open leaves for the
     full page, which is where a document is read and edited.

     Outside .app on purpose: .navbar and .topbar both carry a backdrop-filter,
     and that makes them the containing block for a fixed-position descendant —
     a drawer opened from inside one would be pinned to the bar. -->
<div class="drawer" id="docs-drawer" hidden>
    <div class="drawer-scrim" data-drawer-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="docs-drawer-title">
        <header class="drawer-head">
            <svg class="i" aria-hidden="true"><use href="#i-folder"/></svg>
            <h2 id="docs-drawer-title">Documents</h2>
            <!-- No "Full page" either: filing is done here. Opening a page or
                 a sheet still leaves for its editor, which is a document being
                 written rather than the cabinet being managed. -->
            <button type="button" class="icon-btn" data-drawer-close
                    title="Close" aria-label="Close documents">
                <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
            </button>
        </header>
        <div class="drawer-body" id="docs-drawer-body" aria-busy="true"></div>
    </aside>
</div>

<!-- What a screen reader gets from something that only animates. The copy
     button's tick and its label swap are silent otherwise. -->
<span class="sr-only" role="status" id="live-note"></span>

<div class="toast" th:if="${message}" id="flash-message" role="status">
    <span class="toast-dot" aria-hidden="true">✓</span>
    <span th:text="${message}">Saved.</span>
    <!-- Undo where it actually helps: right after the thing you might regret. -->
    <form method="post" th:if="${undoBugId}" class="inline-form"
          th:action="@{/bugs/{id}/restore(id=${undoBugId})}">
        <input type="hidden" name="actor" class="actor-field">
        <button type="submit" class="toast-undo" id="undo-delete">Undo</button>
    </form>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
