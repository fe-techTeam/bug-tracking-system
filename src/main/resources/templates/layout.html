<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Bug Tracking'">Bug Tracking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Applied before first paint so a dark-theme choice never flashes white. -->
    <script>
        try {
            var t = localStorage.getItem("bugtracking.theme");
            if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) { /* private mode: fall back to the system theme */ }
    </script>
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/bugs}">
        <span class="brand-mark" aria-hidden="true">🐞</span>
        <span>Bug Tracking</span>
    </a>
    <nav>
        <a class="navlink" th:href="@{/bugs}">All Bugs</a>
        <button type="button" class="icon-btn" id="theme-toggle" title="Switch theme" aria-label="Switch theme">☾</button>
        <a class="btn btn-primary" th:href="@{/bugs/new}" id="raise-bug-link">
            <span aria-hidden="true">＋</span> Raise Bug
        </a>
    </nav>
</header>

<div class="toast" th:if="${message}" id="flash-message" role="status">
    <span class="toast-dot" aria-hidden="true">✓</span>
    <span th:text="${message}">Saved.</span>
</div>

<main class="container">
    <div th:replace="${content}">Page content goes here</div>
</main>

<footer class="footer">
    <span>Bug Tracking — Spring Boot + H2</span>
    <span>Press <b>/</b> to search · <b>n</b> to raise a bug</span>
    <a th:href="@{/h2-console}">Database</a>
</footer>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
