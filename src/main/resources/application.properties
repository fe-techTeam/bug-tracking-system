spring.application.name=bugtracking
server.port=8085

# Clients offered in the Client dropdown when raising a bug.
# Edit this list to match your own clients - no code change or rebuild needed.
bugtracking.clients=Acme Capital,Bluepeak AMC,Northwind Securities,Internal
# Used to fill in bugs that were raised before the Client field existed.
bugtracking.default-client=Unspecified

# File-based H2 database: data survives restarts, no separate install needed.
spring.datasource.url=jdbc:h2:file:./data/bugtracking;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tables are created/updated from the entity classes.
spring.jpa.hibernate.ddl-auto=update
# Do not let @NotBlank/@NotNull add NOT NULL to generated DDL: a new required
# field could then never be added to a table that already has rows. The
# constraints still run on every save - they just do not shape the schema.
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.open-in-view=false

# Browse the raw data at http://localhost:8085/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Templates reload without restarting during development.
spring.thymeleaf.cache=false
