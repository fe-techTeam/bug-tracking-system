spring.application.name=bugtracking
server.port=8085

# Credentials live in a .env file in the project root, which is gitignored.
# "optional:" means the app still starts without one - every setting that reads
# from it has a default, or belongs to a profile that is off by default.
# Copy .env.example to .env and fill it in.
spring.config.import=optional:file:.env[.properties]

# --- Accounts ---------------------------------------------------------------
# There are none here. Everyone who can sign in is a row in team_members with a
# BCrypt hash on it, and SecurityConfig reads that table and nothing else - no
# configured account, no in-memory user, no fallback. People are added and given
# passwords on Settings > Team, and projects on the same page.
#
# The one exception is the empty database, which cannot administer itself: only
# an admin may add a member, and there is no admin yet. Set these two in .env
# (never here - this file is committed) and the first start makes that address
# an administrator with that password, hashed, in the table. BootstrapAdmin
# stops looking the moment one active admin has a password, so clear them from
# .env once you are in.
bugtracking.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bugtracking.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# --- The error page ---------------------------------------------------------
# ErrorPageController answers /error in place of Spring's whitelabel page. With
# this on, a 5xx also prints the cause chain behind a "Technical details" fold -
# which is how you find out that "something went wrong" was really a missing
# column. It is on because this is a local app; turn it off before the app is
# reachable by anyone else, and the page still shows the status, the path and
# the reference that finds the failure in the log.
bugtracking.error.show-details=true

# Attachments: files land here, metadata goes in the database.
# With bugtracking.s3.enabled=true the bytes go to a bucket instead - see the
# S3 block further down.
bugtracking.attachments.dir=data/attachments
# The service's own per-file limit sits below the servlet's on purpose: level
# with it, the servlet rejects first and the message naming the file and its
# size is never reached. The request limit has to hold a whole form's worth -
# the raise-a-bug form takes several files at once, and going over it throws
# before the controller runs, which loses the typed-out report as well.
bugtracking.attachments.max-size-bytes=8388608

# Video gets a ceiling of its own rather than raising the one above: a screen
# recording of a bug is the clearest report there is and eight megabytes is
# about twenty seconds of one, while a *screenshot* arriving at 60 MB is
# somebody uploading the wrong thing. 64 MB.
bugtracking.attachments.max-video-size-bytes=67108864

# A project's documents area takes more, and more kinds: it holds the specs and
# decks, not just evidence on a bug. Its own two settings so widening this can
# never widen what a bug accepts.
bugtracking.attachments.max-doc-size-bytes=26214400

# The servlet's limits have to clear the largest of the two service limits
# above, and clear it with room to spare: at the same number the servlet
# rejects first and the friendlier message naming the file never runs. The
# request limit holds a whole form - the raise-a-bug form and the documents
# uploader both take several files at once.
spring.servlet.multipart.max-file-size=96MB
spring.servlet.multipart.max-request-size=256MB

# --- Email (SMTP) -----------------------------------------------------------
# Off until a mail server is configured, and off is the default: with
# bugtracking.mail.enabled=false nothing is built and no connection is opened,
# so a checkout with no .env behaves exactly as it did before this existed.
# Notifications still appear in the bell either way - email mirrors them, it
# does not replace them.
#
# Fill SMTP_* and MAIL_* in .env (see .env.example) and restart. Settings >
# Team says what state this is in, and sends a test message.
bugtracking.mail.enabled=${MAIL_ENABLED:false}
bugtracking.mail.from=${MAIL_FROM:}
bugtracking.mail.from-name=${MAIL_FROM_NAME:Bug Tracking}
bugtracking.mail.reply-to=${MAIL_REPLY_TO:}
bugtracking.mail.subject-prefix=${MAIL_SUBJECT_PREFIX:[Bug Tracking]}
# Whether the whole report travels with the notification. On, so a developer
# reading it on a phone knows what the bug is without opening anything.
bugtracking.mail.include-details=${MAIL_INCLUDE_DETAILS:true}

# Where this instance is reachable, for the link in every message. Not derived
# from the request: an email is built after the response has gone, and a link
# built from "localhost" is a link that works for exactly one reader.
bugtracking.mail.base-url=${APP_BASE_URL:http://localhost:8085}

# The connection itself belongs to Spring. Blank host means no mail sender is
# ever used - the switch above is checked first either way.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
# A mail server having a bad afternoon must not hold a thread for two minutes.
# The send is off the request thread already, but the pool is small.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Database ---------------------------------------------------------------
# File-based H2 by default: data survives restarts, no separate install needed.
# For Supabase (Postgres) instead, start with the "supabase" profile:
#   SPRING_PROFILES_ACTIVE=supabase ./run.sh
# which layers application-supabase.properties over everything below.
spring.datasource.url=jdbc:h2:file:./data/bugtracking;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tables are created/updated from the entity classes.
spring.jpa.hibernate.ddl-auto=update
# Flyway is on the classpath for the supabase profile, where SQL migrations own
# the Postgres schema. On H2, Hibernate's ddl-auto above stays in charge.
spring.flyway.enabled=false
# Do not let @NotBlank/@NotNull add NOT NULL to generated DDL: a new required
# field could then never be added to a table that already has rows. The
# constraints still run on every save - they just do not shape the schema.
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.open-in-view=false

# Browse the raw data at http://localhost:8085/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Templates reload without restarting during development.
spring.thymeleaf.cache=false

# --- S3 ---------------------------------------------------------------------
# Object storage for attachment files. Off by default: with enabled=false the
# S3 client is never built, no credentials are needed, and attachments keep
# using bugtracking.attachments.dir on local disk. Nothing reads these beans
# yet - AttachmentService still writes to disk either way.
bugtracking.s3.enabled=${S3_ENABLED:false}
bugtracking.s3.bucket=${S3_BUCKET:}
bugtracking.s3.region=${S3_REGION:ap-south-1}

# Leave the endpoint blank for real AWS. Set it to point at anything else that
# speaks S3 - Supabase Storage (https://<project-ref>.storage.supabase.co/storage/v1/s3),
# MinIO, R2 - and turn on path-style access for those.
bugtracking.s3.endpoint=${S3_ENDPOINT:}
bugtracking.s3.path-style-access=${S3_PATH_STYLE:false}

# Blank keys mean the AWS default credential chain is used instead: env vars,
# ~/.aws/credentials, or the instance role. Prefer that over writing keys down.
bugtracking.s3.access-key-id=${S3_ACCESS_KEY_ID:}
bugtracking.s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}

# Every object key is written under this prefix, so one bucket can be shared.
bugtracking.s3.key-prefix=attachments/
# How long a generated download link stays valid.
bugtracking.s3.presigned-url-expiry=15m
