# Supabase (Postgres) instead of the local H2 file.
#
# Nothing here is active until the profile is switched on:
#
#   SPRING_PROFILES_ACTIVE=supabase ./run.sh
#
# The values come from environment variables, or from a .env file in the
# project root (see .env.example) which application.properties imports. No
# credential is ever written into this file - it is committed, .env is not.
#
# Where to find each value: Supabase dashboard > Project Settings > Database >
# Connection string > JDBC. Three ways to connect, pick one:
#
#   session pooler      host aws-1-<region>.pooler.supabase.com   port 5432
#                       user postgres.<project-ref>
#                       The safe default: real Postgres sessions, works with
#                       Hibernate's schema update and prepared statements.
#
#   transaction pooler  same host, port 6543
#                       Cheapest on connections, but PgBouncer in transaction
#                       mode has no session state - keep prepareThreshold=0
#                       below and set ddl-auto to validate/none.
#
#   direct              host db.<project-ref>.supabase.co         port 5432
#                       user postgres
#                       IPv6 only unless you have the IPv4 add-on.

spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require&prepareThreshold=0
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase counts connections across every client on the project, so a laptop
# running this app should not hold a large pool open.
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
# Pooled connections go stale behind PgBouncer; recycle them well before it does.
spring.datasource.hikari.max-lifetime=600000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Same as the H2 setup: tables are created and widened from the entity classes.
# Switch to "validate" once the schema is settled, or if you use the
# transaction pooler on port 6543.
spring.jpa.hibernate.ddl-auto=${SUPABASE_DB_DDL:update}

# The H2 console has no database to browse under this profile. Use the
# Supabase dashboard's SQL editor instead.
spring.h2.console.enabled=false
