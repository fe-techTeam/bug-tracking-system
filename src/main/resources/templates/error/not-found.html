<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Not Found', ~{::section})}">
<body>
<section>
    <header class="topbar">
        <h1 class="topbar-title">Not found</h1>
        <div class="topbar-actions">
            <div th:replace="~{fragments :: bell}"></div>
        </div>
    </header>
    <div class="content">
    <div class="panel">
        <div class="empty">
            <span class="empty-art" aria-hidden="true">🕵️</span>
            <h3>Bug not found</h3>
            <p th:text="${errorMessage}" id="error-message">No bug found.</p>
            <div class="actions">
                <a class="btn btn-primary" th:href="@{/bugs}">Back to all bugs</a>
                <a class="btn" th:href="@{/bugs/new}">Raise a bug</a>
            </div>
        </div>
    </div>
    </div>
</section>
</body>
</html>
